name: Обновление списка

on:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "scripts/**"
      - ".github/workflows/update-list.yml"
  # Без фильтра путей: «Проверка» — обязательный статус в правилах main, и PR,
  # на котором она не запустилась, нельзя было бы смёржить.
  pull_request:

permissions: {}

jobs:
  # Pull request: тесты, проверка новых доменов и пробная сборка. Ничего не коммитит.
  check:
    name: Проверка
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Тесты
        run: python -m unittest discover -s tests

      - name: Новые домены
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/domain_checks.py --base-ref "origin/$BASE_REF"

      - name: Пробная сборка
        run: |
          python scripts/build.py --output "$RUNNER_TEMP/list.json" --subnets "$RUNNER_TEMP/subnets.txt" \
            --report build-report.md
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"

  # main и расписание: сборка и коммит tunneling-list.json.
  build:
    name: Сборка
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: update-list
      cancel-in-progress: false
    steps:
      # Если main защищён правилами, пушить может только GitHub App из списка исключений.
      - name: Токен GitHub App
        id: app-token
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      # ref: свежая вершина ветки на момент старта (после ожидания в очереди),
      # а не коммит, на котором запуск был создан.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Тесты
        run: python -m unittest discover -s tests

      - name: Сборка tunneling-list.json
        run: python scripts/build.py --report build-report.md

      - name: Отчёт
        if: always()
        run: |
          if [ -f build-report.md ]; then cat build-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Коммит изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tunneling-list.json ru-subnets.txt
          if git diff --cached --quiet; then
            echo "Список не изменился"
            exit 0
          fi
          git commit -m "Автообновление списка $(date -u +%Y-%m-%d)"
          # Пока шла сборка, в ветку мог прийти чужой коммит — перенесёмся поверх него.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          exit 1
